- insert:
    - id: dsh-work-summary
      name: 'dsh-work-summary'
      config:
        # 数据目录默认 ~/.dsh/dsh-work-summary，设置页可改，所以这里不写死。
        scheduleEnabled: true
        scheduleAdopt: true
        scheduleTime: '23:00'
        scheduleTimeZone: 'Asia/Shanghai'
        # 日报软校验：正文至少引用几处路径/提交号；只提醒，不阻断落盘。
        quality:
          minEvidence: 3
